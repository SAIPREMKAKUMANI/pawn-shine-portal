# ============================================================
# Pawn Shine — Local Frontend UI (Docker Compose)
# Run on: Local developer machine
#
# Usage:
#   1. Set BACKEND_PRIVATE_IP=host.docker.internal in .env
#   2. Build and start:
#      docker compose -f docker-compose.local.yml up -d --build
# ============================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawn_frontend_local
    restart: always
    ports:
      - "8091:8092"
    environment:
      - BACKEND_PRIVATE_IP=host.docker.internal
    volumes:
      - ./nginx-ui.conf:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8092/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
