# ============================================================
# Pawn Shine — Public Instance Nginx Configuration
# Serves frontend UI and reverse-proxies API to private backend
#
# USAGE:
#   Local dev / single-VM (docker-compose.yml):
#     Nginx proxies to "backend" Docker service name.
#     Uses nginx.conf (this file's simpler sibling).
#
#   Production two-instance (docker-compose.public.yml):
#     Nginx proxies to the PRIVATE instance's IP via
#     BACKEND_PRIVATE_IP env var. Uses envsubst templating.
#     Mount this file as /etc/nginx/templates/default.conf.template
# ============================================================

upstream backend_api {
    server ${BACKEND_PRIVATE_IP}:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # -----------------------------------------------------------
    # Frontend: Serve static files (React/Vite build output)
    # -----------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets aggressively (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------
    # API Reverse Proxy: Forward /api/* to private backend
    # -----------------------------------------------------------
    location /api/ {
        proxy_pass         https://${BACKEND_PRIVATE_IP}:8080;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts (backend may take time for large queries)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         4 32k;
    }

    # -----------------------------------------------------------
    # SPA fallback: All other routes → index.html
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
