# ============================================================
# Pawn Shine — Public Instance Nginx Configuration (SSL/TLS Enabled)
# Serves frontend UI over HTTPS and reverse-proxies API to private backend
#
# USAGE:
#   Mounted as /etc/nginx/templates/default.conf.template in Docker container.
#   Uses envsubst to dynamically insert BACKEND_PRIVATE_IP.
# ============================================================

upstream backend_api {
    server ${BACKEND_PRIVATE_IP}:8080;
    keepalive 32;
}

# -----------------------------------------------------------
# HTTP Server (Port 80): ACME challenge & HTTPS Redirect
# -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME-challenge location for Let's Encrypt automated HTTP-01 renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (301 Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------
# HTTPS Server (Port 443): SSL/TLS Secured Frontend & Proxy
# -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    client_max_body_size 50M;

    # SSL Certificates (Mounted from host filesystem)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Security Protocols & Strong AEAD Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -----------------------------------------------------------
    # Frontend: Serve static files (React/Vite build output)
    # -----------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets aggressively (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------
    # API Reverse Proxy: Forward /api/* to private backend
    # -----------------------------------------------------------
    location ^~ /api/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts (backend may take time for large queries)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         4 32k;
    }

    # -----------------------------------------------------------
    # SPA fallback: All other routes → index.html
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

