# ============================================================
# Pawn Shine — Public Instance (Frontend UI Only)
# Run on: Public subnet instance (has public IP)
#
# This compose file runs ONLY the Nginx frontend.
# Nginx reverse-proxies /api/* requests to the private backend
# instance over the Oracle VCN internal network.
#
# Usage:
#   1. Copy this file to ~/pawn-deploy/docker-compose.yml
#   2. Set BACKEND_PRIVATE_IP in ~/pawn-deploy/.env
#   3. docker compose up -d --build
# ============================================================

services:
  frontend:
    build:
      context: ./pawn-frontend
      dockerfile: Dockerfile
    container_name: pawn_frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - BACKEND_PRIVATE_IP=${BACKEND_PRIVATE_IP}
    volumes:
      - ./pawn-frontend/nginx-ui.conf:/etc/nginx/templates/default.conf.template:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
